<style>
/* 1カラムの読み物。左に順位、右に本文。上部にカテゴリ絞り込み */
:root {

  --c-hw: #9a6510;

}
@media (prefers-color-scheme: dark) {

    --accent: #72a6f3; --accent-soft: #1b2a3f;
    --c-ai: #a98cf2; --c-sec: #f08672; --c-cloud: #5cc6c4; --c-hw: #e2ab4f; --c-biz: #8cc475; --c-dev: #72a6f3; --c-other: #9aa4ae;

  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #151c23; --ink: #e4e9ef; --muted: #96a2ae; --line: #252f39;
  --accent: #72a6f3; --accent-soft: #1b2a3f;
  --c-ai: #a98cf2; --c-sec: #f08672; --c-cloud: #5cc6c4; --c-hw: #e2ab4f; --c-biz: #8cc475; --c-dev: #72a6f3; --c-other: #9aa4ae;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; gap: 10px; }
.eyebrow {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em;
  color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px;
}
.eyebrow b { color: var(--accent); font-weight: 700; }
h1 {
  font-family: var(--f-display); font-weight: 900; font-size: clamp(30px, 7vw, 44px);
  line-height: 1.15; margin: 0; letter-spacing: .01em; text-wrap: balance;
}
.trend {
  margin: 4px 0 0; padding: 12px 14px; background: var(--accent-soft);
  border-radius: 8px; font-size: 15px; line-height: 1.7;
}
.trend span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; color: var(--accent); display: block; margin-bottom: 2px; }

.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: 700 13px/1 var(--f-body); color: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); }
.chip .n { font-family: var(--f-mono); font-size: 11px; font-weight: 500; }
.chip[aria-pressed="true"] { color: var(--surface); background: var(--ink); border-color: var(--ink); }
.chip[aria-pressed="true"] i { background: var(--surface); }
.chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

ol.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.item { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 20px 18px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.rank { font-family: var(--f-mono); font-weight: 700; font-size: 22px; line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; }
.item:nth-child(-n+3) .rank { color: var(--accent); }
.body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.cat { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--dot); }
.cat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
.date { font-family: var(--f-mono); font-size: 11.5px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.45; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h2 a { color: inherit; text-decoration: none; }
h2 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.sum { margin: 0; overflow-wrap: anywhere; }
.why { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--line); }
.why b { color: var(--ink); font-weight: 700; }
.src { font-size: 12.5px; }
.src a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.src a:hover { text-decoration: underline; }

.empty { padding: 40px 22px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.empty strong { font-family: var(--f-display); font-size: 18px; }
.empty p { margin: 0; color: var(--muted); }

footer { font-size: 12px; color: var(--muted); line-height: 1.7; }
@media (max-width: 480px) {
  .item { grid-template-columns: 30px 1fr; gap: 10px; padding: 18px 14px; }
  .rank { font-size: 18px; }
  h2 { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script type="application/json" id="news-data">{"date": "2026-11-25", "generated_at": "2026-11-25T05:48+09:00", "trend": "AIエージェントが攻撃と防御の両方で実戦投入され始めたことを示すニュースが並び、Check PointやRadwareなどセキュリティ製品・ベンダー自体が侵害される事例も目立った。開発・クラウド分野ではjQuery 4.1やDynamoDB互換のExtendDB 1.0など、既存資産を活かす実務的なリリースが続いた。", "items": [{"rank": 1, "category": "セキュリティ", "title": "Check Pointの管理サーバー24台が侵害、17カ国22組織で諜報型の攻撃", "summary": "GreyNoiseは、Check Pointのセキュリティ管理サーバーを狙う継続中のキャンペーン（GT13）を確認し、17カ国の政府・金融・エネルギーなど22組織で24台が侵害されたと報告した。侵害後にはSmartConsoleの認証バイパス脆弱性CVE-2026-16232が悪用され、ファイアウォールのDBや認証情報、内部CAファイルの窃取、セキュリティポリシーの無効化まで行われていた。Citrix NetScalerやIvanti、Windows NetLogonなど他製品の脆弱性も併せて狙われている。", "why": "境界防御の管理サーバーそのものが奪われるとポリシー無効化や横展開を許すため、Check Point利用組織はパッチ適用と侵害痕跡の確認が急務。", "source": "BleepingComputer", "url": "https://www.bleepingcomputer.com/news/security/hackers-compromise-check-point-servers-in-22-organizations/", "published": "2026-11-25"}, {"rank": 2, "category": "セキュリティ", "title": "攻撃者のAIエージェントがほぼ自律でゼロデイを発見・悪用、Amazonが報告", "summary": "Amazonによると、攻撃者はオープンソースのAIペネトレーションテスト基盤「Cairn」にIPアドレス一覧と「シェルを取れ」という指示だけを与え、エージェントが東アジアの大学サーバー上の医療画像AIアプリにゼロデイを見つけて掌握した。Palo Alto Networksも同基盤を使った攻撃で少なくとも10組織が侵害されたと報告している。Cairnはモデル非依存で、Claude CodeやCodex、GLMやDeepSeekなどと組み合わせて使われていた。", "why": "人手をほぼ介さない攻撃が現実になり、公開サービスは発見から悪用までの時間が大幅に縮む前提で脆弱性管理を見直す必要がある。", "source": "Ars Technica", "url": "https://arstechnica.com/security/2026/11/amazon-says-hackers-ai-agents-found-and-exploited-0-day-with-little-human-input/", "published": "2026-11-24"}, {"rank": 3, "category": "セキュリティ", "title": "OpenAIとCisco、AIがeBPFでLinuxを守るOSS「Shirudo」を公開", "summary": "OpenAIとCiscoは、AIエージェントがeBPFの制御プログラム「Shield」を動的に書き、稼働中のLinuxで悪用につながる処理だけを遮断するオープンソース基盤「Shirudo」を発表した。恒久パッチを当てるまでの暫定対策という位置付けで、Shieldは適用前にアプリへの影響をテストできる。OpenAIの試験では、Codexで作ったShieldで再起動なしにElasticsearchへの「Java4Shell」悪用を防げたという。", "why": "パッチ検証に時間がかかる本番Linuxで、サービスを止めずに脆弱性を一時的に塞ぐ新しい選択肢になり得る。", "source": "gihyo.jp", "url": "https://gihyo.jp/article/2026/11/shirudo", "published": "2026-11-24"}, {"rank": 4, "category": "ビジネス", "title": "米商務省がMegaspeedをエンティティリストに追加、NVIDIAフアン氏復帰の直後", "summary": "米商務省は、AIチップの中国への迂回輸出の疑いがあるシンガポールのMegaspeedと、そのマレーシア・タイの関連会社をエンティティリストに加え、取引を制限した。同社はフアン氏の騒動の中心にある企業で、商務省は2024年から密輸疑惑を調べていた。フアン氏がNVIDIAのCEOに復帰した数時間後の措置となった。", "why": "先端GPUの輸出管理が東南アジア経由のルートにも厳しく及ぶことを示し、AIインフラの調達や供給に影響し得る。", "source": "The Verge", "url": "https://www.theverge.com/policy/1041270/nvidia-megaspeed-commerce-dept-entity-list", "published": "2026-11-25"}, {"rank": 5, "category": "開発", "title": "jQuery 4.1正式リリース、3.x系は3.8で最後に", "summary": "jQuery 4.1は内部で使っていたgetElementsByTagNameなどをquerySelectorAllに統一し、リダイレクト後のURLを取れるjqXHR.responseURLの追加やuniqueSort()の高速化も行った。同時に公開されたjQuery 3.8はセレクタのReDoS脆弱性の修正などを含む3.x系最後のリリースで、今後は重大な不具合や脆弱性の修正のみになる。IE11のサポートは4.x系で続くが、5.0で削除される見通し。", "why": "社内Webツールなどで3.x系を使い続けている場合、3.8へのセキュリティ更新と4.x系への移行計画を立てる時期に来た。", "source": "Publickey", "url": "https://www.publickey1.jp/blog/26/jquery_41queryselectoralljquery_3xjquery_38.html", "published": "2026-11-25"}, {"rank": 6, "category": "クラウド", "title": "AWSのDynamoDB互換OSS「ExtendDB」がv1.0に、Windowsのローカルでも動作", "summary": "AWSは、DynamoDB互換のデータベースをWindows・macOS・Linuxのローカル環境に構築できるオープンソース「ExtendDB」のバージョン1.0到達を発表した。ExtendDBはフロントエンド部分を担い、エンジンにはPostgreSQL（リファレンス構成）、SQLite、Cassandra、MongoDBのいずれかをプラグインで使う。DynamoDBと同じSDK・コードでアクセスでき、ローカルでの開発・テストやオンプレミスでの利用を想定している。", "why": "DynamoDB前提のアプリをクラウドに出さずにテストしたり、オンプレ版を用意したりする選択肢が公式OSSとして整った。", "source": "Publickey", "url": "https://www.publickey1.jp/blog/26/awsdynamodbextenddb10.html", "published": "2026-11-25"}, {"rank": 7, "category": "セキュリティ", "title": "Radwareが侵害を公表、顧客のS3・Azure Blobのアクセスキーが露出", "summary": "Radwareは、認証なしでインターネットから到達できる状態だった内部のCloud WAF管理APIが11月19日に不正アクセスを受けたと顧客に報告した。顧客の連絡先に加え、一部顧客がログ出力用に設定したAWS S3、Azure Blob Storage、SFTPの認証情報が見られた可能性がある。同社はログ出力用の資格情報を早急にローテーションし、11月19日以降のストレージのアクセスログを確認するよう呼びかけている。", "why": "RadwareのWAFからAzureやAWSへログを出している場合、SASトークンやアクセスキーを今すぐ再発行すべき事案。", "source": "BleepingComputer", "url": "https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/", "published": "2026-11-25"}, {"rank": 8, "category": "クラウド", "title": "Microsoft、サーバーレスPostgreSQL「HorizonDB」をFabricでプレビュー提供", "summary": "Microsoftは、先週一般提供を始めたPostgreSQLサービス「HorizonDB」をMicrosoft Fabricでパブリックプレビューとして提供開始した。単一のPostgreSQLエンドポイントに投げたクエリを、トランザクション系と分析系の適切なエンジンに振り分ける。アナリストは、DatabricksやSnowflakeに追随する動きだが、統合が進むほど他社への移行は難しくなると指摘している。", "why": "Azure上でPostgreSQLを使う.NETアプリが、データ移動なしに分析基盤とつながる構成を検討できるようになる。", "source": "The Register", "url": "https://www.theregister.com/databases/2026/11/24/microsoft-brings-serverless-postgresql-into-fabric-to-bridge-transactions-and-analytics/5311841", "published": "2026-11-25"}, {"rank": 9, "category": "AI", "title": "Z.ai「GLM-5.4」発表、層を2回回すLoop Transformerで750Bながら2〜3T級の性能", "summary": "Z.aiは、GLM-5ベースモデルの28層を2回繰り返し実行するLoop Transformerを初めて採用したフラグシップモデル「GLM-5.4」を発表した。7500億パラメータで2〜3兆規模のモデル並みの性能をうたい、2回目のループで1回目のKVキャッシュを再利用して長文処理のコストを抑える。ZCodeやGLM Coding Planで提供し、APIとオープンウェイトは安全性評価後に公開する予定。", "why": "パラメータを増やさずに推論の深さを稼ぐ手法が実用モデルに入り、コーディング向けモデルの選択肢とコストの見通しが変わる。", "source": "PC Watch", "url": "https://pc.watch.impress.co.jp/docs/news/2158757.html", "published": "2026-11-24"}, {"rank": 10, "category": "ビジネス", "title": "Anthropic株がIPO価格を割り込む、上場から1週間足らず", "summary": "Anthropicの株価は11月24日の取引で一時76ドルまで下がり、公開価格の83ドルを下回った。前日終値からは約12%の下落で、Nasdaq上場初日の111.50ドルから1週間足らずでの急落となる。同日はNVIDIA株も7%超下げており、AI関連銘柄への評価が他のAIスタートアップの資金調達やIPOに波及する可能性がある。", "why": "AI企業への市場の評価は、開発ツールやAPIの価格・投資のペースにも影響するため、動向を押さえておきたい。", "source": "TechCrunch", "url": "https://techcrunch.com/2026/11/24/anthropic-shares-fall-below-ipo-price-a-worrying-sign-for-ai-startups/", "published": "2026-11-25"}]}</script>

  <header>
    <div class="eyebrow" id="eyebrow"><b>IT DAILY</b><span id="dateLabel">—</span><span id="genLabel"></span></div>
    <h1>ITニュース朝刊</h1>
    <p class="trend" id="trend" hidden><span>TODAY'S TREND</span><em id="trendText" style="font-style:normal"></em></p>
  </header>

  <nav class="filters" id="filters" aria-label="カテゴリで絞り込み"></nav>

  <ol class="news" id="list"></ol>

    <a href="../archive.html" style="color:var(--accent)">過去の号を見る</a><br>
    毎朝6時に国内外のIT・テック系ニュースから重要度の高い10件を選び、要約して更新しています。要約はAIによるもので、詳細や正確な数値は各リンク先の元記事で確認してください。
  </footer>

<script>
(function () {
  var CATS = {
    "AI": "--c-ai", "セキュリティ": "--c-sec", "クラウド": "--c-cloud",
    "ハード": "--c-hw", "ビジネス": "--c-biz", "開発": "--c-dev", "その他": "--c-other"
  };
  var data;
  try { data = JSON.parse(document.getElementById("news-data").textContent); }
  catch (e) { data = { items: [] }; }
  var items = (data.items || []).slice().sort(function (a, b) { return (a.rank || 99) - (b.rank || 99); });

  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
    if (!m) return "";
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return m[1] + "." + m[2] + "." + m[3] + " (" + WD[d.getDay()] + ")";
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function dotVar(cat) { return "var(" + (CATS[cat] || "--c-other") + ")"; }

  document.getElementById("dateLabel").textContent = fmtDate(data.date) || "初回更新待ち";
  var g = /T(\d{2}:\d{2})/.exec(data.generated_at || "");
  if (g) document.getElementById("genLabel").textContent = g[1] + " 更新";
  if (data.trend) {
    document.getElementById("trendText").textContent = data.trend;
    document.getElementById("trend").hidden = false;
  }

  var list = document.getElementById("list");
  var filters = document.getElementById("filters");

  if (!items.length) {
    filters.hidden = true;
    var li = el("li", "empty");
    li.appendChild(el("strong", null, "最初の号を準備中です"));
    li.appendChild(el("p", null, "毎朝6時に、その日のITニュース上位10件がここに並びます。カテゴリ別に絞り込み、見出しから元記事に移動できます。"));
    list.appendChild(li);
    return;
  }

  items.forEach(function (it, i) {
    var li = el("li", "item");
    li.dataset.cat = it.category || "その他";
    li.style.setProperty("--dot", dotVar(it.category));
    li.appendChild(el("div", "rank", String(it.rank || i + 1).padStart(2, "0")));
    var b = el("div", "body");
    var meta = el("div", "meta");
    meta.appendChild(el("span", "cat", it.category || "その他"));
    if (it.published) meta.appendChild(el("span", "date", it.published.replace(/-/g, ".")));
    b.appendChild(meta);
    var h = el("h2");
    if (it.url) {
      var a = el("a", null, it.title);
      a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      h.appendChild(a);
    } else { h.textContent = it.title; }
    b.appendChild(h);
    if (it.summary) b.appendChild(el("p", "sum", it.summary));
    if (it.why) {
      var w = el("p", "why");
      w.appendChild(el("b", null, "注目点 "));
      w.appendChild(document.createTextNode(it.why));
      b.appendChild(w);
    }
    if (it.source || it.url) {
      var s = el("div", "src");
      if (it.url) {
        var sa = el("a", null, (it.source || "元記事") + " で読む →");
        sa.href = it.url; sa.target = "_blank"; sa.rel = "noopener";
        s.appendChild(sa);
      } else { s.textContent = it.source; }
      b.appendChild(s);
    }
    li.appendChild(b);
    list.appendChild(li);
  });

  var counts = {};
  items.forEach(function (it) { var c = it.category || "その他"; counts[c] = (counts[c] || 0) + 1; });
  var current = "すべて";
  try { current = localStorage.getItem("itnews-filter") || "すべて"; } catch (e) {}
  if (current !== "すべて" && !counts[current]) current = "すべて";

  function makeChip(label, n, color) {
    var c = el("button", "chip");
    c.type = "button";
    if (color) { c.style.setProperty("--dot", color); c.appendChild(el("i")); }
    c.appendChild(document.createTextNode(label));
    c.appendChild(el("span", "n", String(n)));
    c.dataset.cat = label;
    c.addEventListener("click", function () { apply(label); });
    filters.appendChild(c);
  }
  makeChip("すべて", items.length, null);
  Object.keys(CATS).forEach(function (k) { if (counts[k]) makeChip(k, counts[k], dotVar(k)); });
  Object.keys(counts).forEach(function (k) { if (!CATS[k]) makeChip(k, counts[k], dotVar(k)); });

  function apply(cat) {
    current = cat;
    try { localStorage.setItem("itnews-filter", cat); } catch (e) {}
    Array.prototype.forEach.call(filters.children, function (c) {
      c.setAttribute("aria-pressed", c.dataset.cat === cat ? "true" : "false");
    });
    Array.prototype.forEach.call(list.children, function (li) {
      li.hidden = !(cat === "すべて" || li.dataset.cat === cat);
    });
  }
  apply(current);
})();
</script>
