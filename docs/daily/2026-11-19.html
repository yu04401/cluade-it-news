<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITニュース朝刊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 1カラムの読み物。左に順位、右に本文。上部にカテゴリ絞り込み */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #16202a;
  --muted: #5a6572;
  --line: #dce1e8;
  --accent: #1f5fbf;
  --accent-soft: #e4ecf8;
  --c-ai: #7445d1;
  --c-sec: #c2402b;
  --c-cloud: #17807f;
  --c-hw: #9a6510;
  --c-biz: #3b6d2d;
  --c-dev: #1f5fbf;
  --c-other: #6b7480;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #151c23; --ink: #e4e9ef; --muted: #96a2ae; --line: #252f39;
    --accent: #72a6f3; --accent-soft: #1b2a3f;
    --c-ai: #a98cf2; --c-sec: #f08672; --c-cloud: #5cc6c4; --c-hw: #e2ab4f; --c-biz: #8cc475; --c-dev: #72a6f3; --c-other: #9aa4ae;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #151c23; --ink: #e4e9ef; --muted: #96a2ae; --line: #252f39;
  --accent: #72a6f3; --accent-soft: #1b2a3f;
  --c-ai: #a98cf2; --c-sec: #f08672; --c-cloud: #5cc6c4; --c-hw: #e2ab4f; --c-biz: #8cc475; --c-dev: #72a6f3; --c-other: #9aa4ae;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; gap: 10px; }
.eyebrow {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em;
  color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px;
}
.eyebrow b { color: var(--accent); font-weight: 700; }
h1 {
  font-family: var(--f-display); font-weight: 900; font-size: clamp(30px, 7vw, 44px);
  line-height: 1.15; margin: 0; letter-spacing: .01em; text-wrap: balance;
}
.trend {
  margin: 4px 0 0; padding: 12px 14px; background: var(--accent-soft);
  border-radius: 8px; font-size: 15px; line-height: 1.7;
}
.trend span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; color: var(--accent); display: block; margin-bottom: 2px; }

.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: 700 13px/1 var(--f-body); color: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); }
.chip .n { font-family: var(--f-mono); font-size: 11px; font-weight: 500; }
.chip[aria-pressed="true"] { color: var(--surface); background: var(--ink); border-color: var(--ink); }
.chip[aria-pressed="true"] i { background: var(--surface); }
.chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

ol.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.item { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 20px 18px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.rank { font-family: var(--f-mono); font-weight: 700; font-size: 22px; line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; }
.item:nth-child(-n+3) .rank { color: var(--accent); }
.body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.cat { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--dot); }
.cat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
.date { font-family: var(--f-mono); font-size: 11.5px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.45; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h2 a { color: inherit; text-decoration: none; }
h2 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.sum { margin: 0; overflow-wrap: anywhere; }
.why { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--line); }
.why b { color: var(--ink); font-weight: 700; }
.src { font-size: 12.5px; }
.src a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.src a:hover { text-decoration: underline; }

.empty { padding: 40px 22px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.empty strong { font-family: var(--f-display); font-size: 18px; }
.empty p { margin: 0; color: var(--muted); }

footer { font-size: 12px; color: var(--muted); line-height: 1.7; }
@media (max-width: 480px) {
  .item { grid-template-columns: 30px 1fr; gap: 10px; padding: 18px 14px; }
  .rank { font-size: 18px; }
  h2 { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>

<script type="application/json" id="news-data">{"date": "2026-11-19", "generated_at": "2026-11-19T05:52+09:00", "trend": "Microsoft公式PyPIパッケージの侵害やMetabase脆弱性を突いた情報漏えいなど、開発・分析ツールのサプライチェーンを狙う攻撃が目立つ。一方でNvidiaの好決算とAnthropicの上場でAI投資の熱は続いている。", "items": [{"rank": 1, "category": "セキュリティ", "title": "Microsoft「Agent Framework」のPyPIパッケージが侵害、認証情報を盗む不正版が公開", "summary": "Microsoft公式のPython向けAgent FrameworkパッケージのPyPI上に、11月17日に不正なバージョン1.26.1と1.26.2が公開された。importしなくてもPython起動時に動く仕組みで、Azure・AWS・GitHub・Docker・Hugging Face・OpenAIなどの認証情報を外部に送信する。PyPIは両版を隔離済みで、1.26.0からの再構築と認証情報のローテーションが推奨されている。", "why": "該当版を入れた開発機やCIでは、パッケージを使っていなくてもクラウド等の認証情報が漏れている恐れがあり、即時の確認とキー更新が必要。", "source": "BleepingComputer", "url": "https://www.bleepingcomputer.com/news/security/microsofts-agent-framework-pypi-package-compromised-to-steal-credentials/", "published": "2026-11-18"}, {"rank": 2, "category": "ハード", "title": "Nvidia第3四半期は売上1158億ドルで前年比2倍超、取締役会はフアン氏のCEO復帰を否定", "summary": "Nvidiaの第3四半期売上高は1158億ドル（前年同期比103%増）で、データセンター部門が1076億ドルを占め、市場予想を上回った。第4四半期の売上見通しは1274億〜1326億ドルで、1500億ドルの自社株買いも発表した。取締役会議長はジェンスン・フアン氏をCEOに戻す考えはないとし、コレット・クレス氏が暫定CEOを務める。", "why": "AI向けGPU需要の強さが続く一方で経営体制は不透明で、GPU供給や価格、CUDAエコシステムの先行きを左右する。", "source": "Yahoo Finance", "url": "https://finance.yahoo.com/technology/live/nvidia-earnings-live-nvidia-posts-q3-beat-board-says-it-will-not-reinstate-jensen-huang-as-ceo-221428433.html", "published": "2026-11-18"}, {"rank": 3, "category": "クラウド", "title": "Microsoft、セキュリティを既定で強化した「Windows Server 2028」を発表", "summary": "Ignite 2026でWindows Server 2028が発表され、Server Coreは強化済み設定が既定となり、管理者が項目ごとに緩められるセキュリティベースラインを備える。NTLMよりKerberosを優先し、SMB署名・暗号化、ML-KEMによるハイブリッド耐量子鍵交換を含むTLS、Basic/Digest認証なしのWinRMなどを採用する。Intuneでのサーバー管理、NVMeネイティブストレージ、Windows MLやvLLM、Llama.cppによるAI推論にも対応する。", "why": "NTLMやレガシー認証に依存する社内ツールや運用スクリプトは、移行時に動かなくなる可能性があり早めの棚卸しが必要。", "source": "BleepingComputer", "url": "https://www.bleepingcomputer.com/news/microsoft/microsoft-announces-windows-server-2028-with-hardened-security/", "published": "2026-11-18"}, {"rank": 4, "category": "ビジネス", "title": "Anthropic、NasdaqでのIPOへ　ティッカーは「ANT」", "summary": "Claudeを開発するAnthropicが、Nasdaqへの上場に向けて11月18日に公開価格を決め、19日から取引が始まる予定と報じられている。ティッカーシンボルは「ANT」で、AI企業として過去最大級の上場になると注目されている。", "why": "主要LLMベンダーが上場企業になることで、APIの価格や提供方針が市場の目にさらされ、利用企業の調達判断にも影響しうる。", "source": "CNN", "url": "https://cnn.com/2026/11/18/investing/anthropic-ipo-wall-street-ai", "published": "2026-11-18"}, {"rank": 5, "category": "セキュリティ", "title": "NewsPicksの情報漏えい、原因はBIツールMetabaseの脆弱性", "summary": "NewsPicksを運営するユーザベースは、漏えいの原因がMetabaseのログイン前SQLインジェクション脆弱性（CVE-2026-72898、CVSS 10.0）だったと公表した。パッチ公開前日の8月11日にデータが盗まれ、攻撃者は多要素認証を回避して管理者APIキーを作り、9月28日まで断続的にアクセスしていた。クレジットカード情報の一部36万1598件、メールアドレス32万2531件などが漏えいした。", "why": "社内向けBIや管理ツールを外部公開していると、パッチ適用前でも攻撃されうるため、公開範囲の制限が重要になる。", "source": "ITmedia NEWS", "url": "https://www.itmedia.co.jp/news/article/2611/18/2000003300/", "published": "2026-11-18"}, {"rank": 6, "category": "クラウド", "title": "AppleのiCloudやApp Storeで大規模障害、原因は内部アップデート", "summary": "11月17日、iCloudへのサインインができなくなるなど、App Store、Apple Music、Apple Payを含むApple の複数サービスで障害が起きた。Appleは原因を内部のアップデートとし、サイバー攻撃は否定している。", "why": "Apple IDに依存するアプリやサインイン機能は外部障害の影響を受けるため、障害時の振る舞いを設計に入れておく必要がある。", "source": "9to5Mac", "url": "https://9to5mac.com/2026/11/17/icloud-app-store-and-other-apple-services-hit-by-ongoing-outage/", "published": "2026-11-17"}, {"rank": 7, "category": "その他", "title": "KDDI、ネットにつながらない携帯「INFOBAR ZERO」を発表", "summary": "KDDIは通話とSMSだけに対応しインターネットに接続しない携帯電話「INFOBAR ZERO」を12月25日に発売する。価格は税込3万2780円で、INFOBARの新機種は約8年ぶり。デジタル利用を減らしたい若年層などを想定し、販売規模は従来機より一桁小さいと見込んでいる。", "why": "スマホ離れの需要を大手キャリアが製品化した例で、端末の多様化と通信サービスの設計に影響しうる。", "source": "ITmedia NEWS", "url": "https://www.itmedia.co.jp/news/article/2611/18/2000003288/", "published": "2026-11-18"}]}</script>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"><b>IT DAILY</b><span id="dateLabel">—</span><span id="genLabel"></span></div>
    <h1>ITニュース朝刊</h1>
    <p class="trend" id="trend" hidden><span>TODAY'S TREND</span><em id="trendText" style="font-style:normal"></em></p>
  </header>

  <nav class="filters" id="filters" aria-label="カテゴリで絞り込み"></nav>

  <ol class="news" id="list"></ol>

  <footer>
    <a href="../archive.html" style="color:var(--accent)">過去の号を見る</a><br>
    毎朝6時に国内外のIT・テック系ニュースから重要度の高い10件を選び、要約して更新しています。要約はAIによるもので、詳細や正確な数値は各リンク先の元記事で確認してください。
  </footer>
</div>

<script>
(function () {
  var CATS = {
    "AI": "--c-ai", "セキュリティ": "--c-sec", "クラウド": "--c-cloud",
    "ハード": "--c-hw", "ビジネス": "--c-biz", "開発": "--c-dev", "その他": "--c-other"
  };
  var data;
  try { data = JSON.parse(document.getElementById("news-data").textContent); }
  catch (e) { data = { items: [] }; }
  var items = (data.items || []).slice().sort(function (a, b) { return (a.rank || 99) - (b.rank || 99); });

  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
    if (!m) return "";
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return m[1] + "." + m[2] + "." + m[3] + " (" + WD[d.getDay()] + ")";
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function dotVar(cat) { return "var(" + (CATS[cat] || "--c-other") + ")"; }

  document.getElementById("dateLabel").textContent = fmtDate(data.date) || "初回更新待ち";
  var g = /T(\d{2}:\d{2})/.exec(data.generated_at || "");
  if (g) document.getElementById("genLabel").textContent = g[1] + " 更新";
  if (data.trend) {
    document.getElementById("trendText").textContent = data.trend;
    document.getElementById("trend").hidden = false;
  }

  var list = document.getElementById("list");
  var filters = document.getElementById("filters");

  if (!items.length) {
    filters.hidden = true;
    var li = el("li", "empty");
    li.appendChild(el("strong", null, "最初の号を準備中です"));
    li.appendChild(el("p", null, "毎朝6時に、その日のITニュース上位10件がここに並びます。カテゴリ別に絞り込み、見出しから元記事に移動できます。"));
    list.appendChild(li);
    return;
  }

  items.forEach(function (it, i) {
    var li = el("li", "item");
    li.dataset.cat = it.category || "その他";
    li.style.setProperty("--dot", dotVar(it.category));
    li.appendChild(el("div", "rank", String(it.rank || i + 1).padStart(2, "0")));
    var b = el("div", "body");
    var meta = el("div", "meta");
    meta.appendChild(el("span", "cat", it.category || "その他"));
    if (it.published) meta.appendChild(el("span", "date", it.published.replace(/-/g, ".")));
    b.appendChild(meta);
    var h = el("h2");
    if (it.url) {
      var a = el("a", null, it.title);
      a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      h.appendChild(a);
    } else { h.textContent = it.title; }
    b.appendChild(h);
    if (it.summary) b.appendChild(el("p", "sum", it.summary));
    if (it.why) {
      var w = el("p", "why");
      w.appendChild(el("b", null, "注目点 "));
      w.appendChild(document.createTextNode(it.why));
      b.appendChild(w);
    }
    if (it.source || it.url) {
      var s = el("div", "src");
      if (it.url) {
        var sa = el("a", null, (it.source || "元記事") + " で読む →");
        sa.href = it.url; sa.target = "_blank"; sa.rel = "noopener";
        s.appendChild(sa);
      } else { s.textContent = it.source; }
      b.appendChild(s);
    }
    li.appendChild(b);
    list.appendChild(li);
  });

  var counts = {};
  items.forEach(function (it) { var c = it.category || "その他"; counts[c] = (counts[c] || 0) + 1; });
  var current = "すべて";
  try { current = localStorage.getItem("itnews-filter") || "すべて"; } catch (e) {}
  if (current !== "すべて" && !counts[current]) current = "すべて";

  function makeChip(label, n, color) {
    var c = el("button", "chip");
    c.type = "button";
    if (color) { c.style.setProperty("--dot", color); c.appendChild(el("i")); }
    c.appendChild(document.createTextNode(label));
    c.appendChild(el("span", "n", String(n)));
    c.dataset.cat = label;
    c.addEventListener("click", function () { apply(label); });
    filters.appendChild(c);
  }
  makeChip("すべて", items.length, null);
  Object.keys(CATS).forEach(function (k) { if (counts[k]) makeChip(k, counts[k], dotVar(k)); });
  Object.keys(counts).forEach(function (k) { if (!CATS[k]) makeChip(k, counts[k], dotVar(k)); });

  function apply(cat) {
    current = cat;
    try { localStorage.setItem("itnews-filter", cat); } catch (e) {}
    Array.prototype.forEach.call(filters.children, function (c) {
      c.setAttribute("aria-pressed", c.dataset.cat === cat ? "true" : "false");
    });
    Array.prototype.forEach.call(list.children, function (li) {
      li.hidden = !(cat === "すべて" || li.dataset.cat === cat);
    });
  }
  apply(current);
})();
</script>
</body>
